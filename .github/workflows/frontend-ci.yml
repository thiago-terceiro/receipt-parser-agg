name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run dependency security audit
        run: pnpm run security:audit

      - name: Run security and guardrail checks
        run: pnpm run security:check

      - name: Verify frontend checks
        run: pnpm run ci:verify

      - name: Build production application
        run: pnpm run build

      - name: Install Playwright Chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E and Axe accessibility suite
        run: pnpm run test:e2e
        env:
          CI: "true"
          NEXTAUTH_SECRET: ci-ephemeral-nextauth-secret-not-used-in-prod
          NEXTAUTH_URL: http://localhost:3107
