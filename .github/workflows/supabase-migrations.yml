name: Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - frontend/supabase/migrations/**
      - .github/workflows/supabase-migrations.yml
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY to run remote Supabase migrations
        required: true
        type: string

jobs:
  apply:
    if: github.event_name == 'push' || github.event.inputs.confirmation == 'APPLY'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi
          if [[ -z "${SUPABASE_PROJECT_REF:-}" ]]; then
            echo "Missing GitHub variable: SUPABASE_PROJECT_REF" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.91.1

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Check migration status
        run: supabase migration list

      - name: Dry run pending migrations
        run: supabase db push --dry-run

      - name: Apply remote migrations
        run: supabase db push --yes